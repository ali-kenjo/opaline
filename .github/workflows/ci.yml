name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  DEBIAN_FRONTEND: noninteractive

# GitHub has no Ubuntu 26.04 runner image yet, so every job runs in an ubuntu:26.04 container
# to build against the same WebKitGTK/GTK versions users have.
jobs:
  check:
    name: Lint and test
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    steps:
      - name: System packages
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential ca-certificates curl git pkg-config \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev \
            libpipewire-0.3-dev clang
      - uses: actions/checkout@v4
      - name: Rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --component rustfmt,clippy
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: pnpm
        run: corepack enable && corepack prepare --activate
      - uses: Swatinem/rust-cache@v2
      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile
      - name: Frontend lint, types and unit tests
        working-directory: app
        run: |
          pnpm lint
          pnpm typecheck
          pnpm test
      - name: Build frontend (embedded by the Rust build)
        working-directory: app
        run: pnpm exec vite build
      - name: rustfmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Rust tests
        run: cargo test --workspace --locked
      - name: Playwright (WebKit)
        working-directory: app
        run: |
          pnpm exec playwright install --with-deps webkit
          pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: app/playwright-report
          retention-days: 7

  deb:
    name: Build .deb
    needs: check
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    steps:
      - name: System packages
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential ca-certificates curl git pkg-config file \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev \
            libpipewire-0.3-dev clang
      - uses: actions/checkout@v4
      - name: Rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: pnpm
        run: corepack enable && corepack prepare --activate
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - name: Tauri bundle
        working-directory: app
        run: pnpm tauri build --bundles deb
      - uses: actions/upload-artifact@v4
        with:
          name: opaline-deb
          path: target/release/bundle/deb/*.deb
          retention-days: 14
