name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  DEBIAN_FRONTEND: noninteractive

jobs:
  release:
    name: Build, sign, and publish .deb
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    steps:
      - name: System packages
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential ca-certificates curl git pkg-config file libglib2.0-bin \
            desktop-file-utils appstream minisign \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev \
            libpipewire-0.3-dev clang cmake
      - uses: actions/checkout@v7
      - name: Rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: pnpm
        run: corepack enable && corepack prepare --activate
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - name: Stage auxiliary .deb assets
        run: ./scripts/stage-deb-assets.sh
      - name: Build .deb
        working-directory: app
        run: pnpm tauri build --bundles deb
      - name: Generate SHA256SUMS and minisign signature
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          mkdir -p release-assets
          cp target/release/bundle/deb/*.deb release-assets/
          cd release-assets
          sha256sum *.deb > SHA256SUMS
          if [ -n "$MINISIGN_SECRET_KEY" ]; then
            printf '%s\n' "$MINISIGN_SECRET_KEY" > /tmp/opaline.key
            chmod 600 /tmp/opaline.key
            printf '%s\n' "$MINISIGN_PASSWORD" | minisign -Sm SHA256SUMS -s /tmp/opaline.key
            rm -f /tmp/opaline.key
          else
            # The app refuses unsigned updates, so an unsigned release would be useless to
            # existing installs. Fail instead of publishing one.
            echo "::error::MINISIGN_SECRET_KEY is not configured; refusing to publish an unsigned release"
            exit 1
          fi
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-assets/*.deb
            release-assets/SHA256SUMS
            release-assets/SHA256SUMS.minisig
