[package]
name = "opaline-core"
description = "Sensor engine, store, IPC server and desktop backends of Opaline"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
opaline-ipc = { path = "../opaline-ipc" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
futures-util = { version = "0.3", default-features = false, features = ["std", "async-await-macro"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros", "fs", "process"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
tracing-journald = "0.3"
zbus = { version = "6", default-features = false, features = ["tokio", "proxy", "service"] }
rustix = { version = "1", features = ["fs", "process", "param"] }
nvml-wrapper = "0.13"
socket2 = { version = "0.6", features = ["all"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2"] }
pipewire = "0.10"
rustfft = "6"
bollard = "0.21"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros", "fs", "test-util"] }
tempfile = "3"

[lints]
workspace = true
