<?xml version="1.0" encoding="UTF-8"?>
<!-- Opaline app icon. Original artwork, GPL-3.0-or-later like the rest of the project. -->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="opal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7ee0d6"/>
      <stop offset="0.38" stop-color="#8aa8ff"/>
      <stop offset="0.7" stop-color="#d79bff"/>
      <stop offset="1" stop-color="#ffb38a"/>
    </linearGradient>
    <radialGradient id="sheen" cx="0.3" cy="0.22" r="0.75">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.75"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.5"/>
    </linearGradient>
  </defs>
  <!-- base tile -->
  <rect x="40" y="40" width="432" height="432" rx="112" fill="url(#opal)"/>
  <rect x="40" y="40" width="432" height="432" rx="112" fill="url(#sheen)"/>
  <!-- two glass widgets: a wide one and a small square -->
  <rect x="104" y="112" width="304" height="132" rx="40" fill="#ffffff" fill-opacity="0.34"
