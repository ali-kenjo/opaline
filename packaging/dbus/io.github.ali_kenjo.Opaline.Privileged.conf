<?xml version="1.0" encoding="UTF-8"?>
<!-- Bus policy for Opaline's privileged helper. Installed to /usr/share/dbus-1/system.d/.
     Only root may own the name; anyone may call it, and the helper itself asks polkit
     (io.github.ali_kenjo.opaline.read-sensors: active local sessions only). -->
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="root">
    <allow own="io.github.ali_kenjo.Opaline.Privileged"/>
  </policy>
  <policy context="default">
    <allow send_destination="io.github.ali_kenjo.Opaline.Privileged"
           send_interface="io.github.ali_kenjo.Opaline.Privileged1"/>
    <allow send_destination="io.github.ali_kenjo.Opaline.Privileged"
           send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="io.github.ali_kenjo.Opaline.Privileged"
           send_interface="org.freedesktop.DBus.Peer"/>
  </policy>
</busconfig>
