[package]
name = "opaline"
description = "Glass widgets for your Ubuntu desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
default-run = "opaline"

[[bin]]
name = "opaline"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
opaline-core = { path = "../../crates/opaline-core" }
opaline-ipc = { path = "../../crates/opaline-ipc" }
tauri = { version = "2", features = ["tray-icon", "image-png"] }
gtk = "0.18"
webkit2gtk = "2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros", "process", "signal"] }
tracing = "0.1"
clap = { version = "4", features = ["derive"] }

[lints]
workspace = true
